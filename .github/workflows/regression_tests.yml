name: Regression Unit Tests

on:
  push:
    branches: [ "**" ]
  pull_request:
    branches: [ "main" ]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Write key.properties file
        run: |
          echo $KEY_PROPERTIES | base64 -d > app/androidApp/src/main/key.properties
        shell: bash
        env:
          KEY_PROPERTIES: ${{ secrets.KEY_PROPERTIES }}

      - name: Create keystore folder
        run: mkdir -p app/androidApp/src/main/keystore

      - name: Write composeship_release.keystore file
        env:
          RELEASE_KEYSTORE: ${{ secrets.RELEASE_KEYSTORE }}
        run: |
          echo $RELEASE_KEYSTORE | base64 --decode > app/androidApp/src/main/keystore/composeship_release.keystore

      - name: Write composeship_debug.keystore file
        run: |
          echo $DEBUG_KEYSTORE | base64 -d > app/androidApp/src/main/keystore/composeship_debug.keystore
        shell: bash
        env:
          DEBUG_KEYSTORE: ${{ secrets.DEBUG_KEYSTORE }}

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'
          cache: gradle

      - name: Grant execute permission for gradlew
        run: chmod +x gradlew

      - name: Run app unit tests
        run: ./gradlew :app:androidApp:testDebugUnitTest

      - name: Run server unit tests
        run: ./gradlew :server:test
