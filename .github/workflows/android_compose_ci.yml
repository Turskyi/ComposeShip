name: Upload Android Build to App Tester

on: [ push ]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Build Compose Multiplatform (Android)
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v2.3.3

      - name: Write google-services.json file
        run: |
          cd app/androidApp
          echo $GOOGLE_SERVICES | base64 -d > google-services.json
        env:
          GOOGLE_SERVICES: ${{ secrets.GOOGLE_SERVICES }}

      - name: Write key.properties file
        run: |
          echo $KEY_PROPERTIES | base64 -d > app/androidApp/src/main/key.properties
        shell: bash
        env:
          KEY_PROPERTIES: ${{ secrets.KEY_PROPERTIES }}

      - name: Create keystore folder
        run: mkdir -p app/androidApp/src/main/keystore

      - name: Write composeship_release.keystore file
        env:
          RELEASE_KEYSTORE: ${{ secrets.RELEASE_KEYSTORE }}
        run: |
          echo $RELEASE_KEYSTORE | base64 --decode > app/androidApp/src/main/keystore/composeship_release.keystore

      - name: Write composeship_debug.keystore file
        run: |
          echo $DEBUG_KEYSTORE | base64 -d > app/androidApp/src/main/keystore/composeship_debug.keystore
        shell: bash
        env:
          DEBUG_KEYSTORE: ${{ secrets.DEBUG_KEYSTORE }}

      - name: Set up JDK 17
        uses: actions/setup-java@v2
        with:
          java-version: '17'
          distribution: 'temurin' # Eclipse Temurin https://adoptium.net/

      - name: Generate Release APK
        run: ./gradlew assembleRelease

      - name: Upload artifact to Firebase App Distribution
        uses: wzieba/Firebase-Distribution-Github-Action@v1
        with:
          appId: ${{ secrets.FIREBASE_ANDROID_APP_ID }}
          serviceCredentialsFileContent: ${{ secrets.FIREBASE_SERVICE_ACCOUNT_JSON }}
          groups: testers
          releaseNotes: "Android Application Build"
          file: app/androidApp/build/outputs/apk/release/androidApp-release.apk
